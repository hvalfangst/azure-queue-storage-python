[project]
name = "azure-queue-storage-client"
version = "0.1.0"
description = "FastAPI client for Azure Storage Queue"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.2",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "pydantic-settings>=2.6.0",
    "azure-storage-queue>=12.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.6",
    "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["client"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
